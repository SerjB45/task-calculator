{% extends 'base.html' %}

{% block title %}Редактирование задачи "{{ task.title }}"{% endblock %}

{% block content %}
<h1>Редактируйте задачу "{{ task.title }}"</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить изменения</button>
</form>
{% endblock %}
