{% extends 'base.html' %}

{% block title %}Подтверждение удаления{% endblock %}

{% block content %}
<h1>Вы уверены?</h1>
<p>Вы действительно хотите удалить объект "{{ object }}"?</p>
<form action="" method="post">
    {% csrf_token %}
    <input type="hidden" value="DELETE">
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="#" onclick="history.back();return false;" class="btn btn-secondary">Вернуться назад</a>
</form>
{% endblock %}
