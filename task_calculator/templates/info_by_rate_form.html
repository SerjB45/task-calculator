{% extends 'base.html' %}

{% block title %}Редактирование методики оценки "{% block title_inner %}{{ type_stage.name_stage }}{% endblock %}"{% endblock %}

{% block content %}
<h1>Редактируйте методику оценки "{{ type_stage.name_stage }}"</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить изменения</button>
</form>
{% endblock %}
