{% extends 'base.html' %}

{% block title %}Редактирование этапа "{% block title_inner %}{{ detail.stage }}{% endblock %}"{% endblock %}

{% block content %}
<h1>Редактируйте этап "{{ detail.stage }}"</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить изменения</button>
</form>
{% endblock %}
